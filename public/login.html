<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>T-BASS — Koneksyon Admin</title>
<style>
:root{color-scheme:dark;--blue:#168cff;--red:#ff123b;--muted:#9bb2c6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,rgba(1,7,14,.92),rgba(2,20,36,.97)),url('tbass-cinema-bg.svg') center/cover fixed,#020913;color:#f7fbff;font-family:Arial, sans-serif}.card{width:min(100%,420px);padding:28px;border:1px solid #0d5b8d;border-radius:18px;background:rgba(4,20,35,.97);box-shadow:0 25px 80px #0009}.brand{font-size:29px;font-weight:900;letter-spacing:.5px}.brand span{color:var(--red)}.eyebrow{color:#75c9ff;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:2px;margin-top:20px}h1{font-size:25px;margin:8px 0}p{color:var(--muted);font-size:14px;line-height:1.5}label{display:block;margin:18px 0 7px;font-size:13px;color:#dceaf5}input{width:100%;padding:13px;border:1px solid #1b5d85;border-radius:9px;background:#03111e;color:#fff;font-size:16px}button{width:100%;padding:13px;margin-top:20px;border:0;border-radius:9px;background:var(--blue);color:white;font-weight:800;font-size:15px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.msg{min-height:22px;color:#ff879b;font-size:13px}.foot{text-align:center;font-size:12px;margin-top:18px;color:#7691a7}a{color:#8edfff;text-decoration:none}
</style></head>
<body><main class="card"><div class="brand">▶ T-<span>BASS</span></div><div class="eyebrow">Espace sécurisé</div><h1>Koneksyon administratè</h1><p>Antre non itilizatè ak modpas administratè a pou ouvri Dashboard la.</p>
<form id="loginForm"><label for="username">Non itilizatè</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Modpas</label><input id="password" name="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">Konekte sou Dashboard</button><p id="message" class="msg" role="alert" aria-live="polite"></p></form><div class="foot">T-BASS · Aksè rezève pou administratè</div></main>
<script>
const form=document.getElementById('loginForm'), message=document.getElementById('message'), submit=document.getElementById('submit');
async function checkSession(){try{const r=await fetch('/api/admin/me',{credentials:'same-origin'});if(r.ok)location.replace('/dashboard.html')}catch(e){}}
form.addEventListener('submit',async e=>{e.preventDefault();message.textContent='';submit.disabled=true;submit.textContent='Koneksyon...';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});const data=await r.json();if(r.ok&&data.ok){location.replace('/dashboard.html');return}message.textContent=data.error||'Koneksyon an echwe. Verifye enfòmasyon yo.';}catch(e){message.textContent='Pa kapab konekte ak sèvè a. Eseye ankò.'}finally{submit.disabled=false;submit.textContent='Konekte sou Dashboard'}});
checkSession();
</script></body></html>
